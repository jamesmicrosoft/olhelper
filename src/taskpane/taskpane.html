<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>OLHelper</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <h1>OLHelper</h1>
      <p class="subtitle">Persistent routing for support-case email</p>

      <section id="message-summary" aria-label="Selected message">
        <div id="subject"></div>
        <div id="tracking-id"></div>
        <div id="case-state">Case status has not been checked.</div>
      </section>

      <section id="case-actions" aria-label="Case actions">
        <button id="check-status" class="secondary" type="button">
          Refresh status
        </button>
        <button id="track-case" type="button" hidden>
          Track case and move message
        </button>
        <button id="archive-case" class="warning" type="button" hidden>
          Archive case
        </button>
        <button id="delete-case" class="warning" type="button" hidden>
          Delete case and emails
        </button>
        <button id="reopen-case" type="button" hidden>
          Reopen case
        </button>
        <button id="repair-case" class="secondary" type="button" hidden>
          Repair routing
        </button>
      </section>

      <section id="confirmation" aria-label="Confirm mailbox changes" hidden>
        <p id="confirmation-message"></p>
        <p id="confirmation-details"></p>
        <div class="button-row">
          <button id="confirm-action" type="button">
            Confirm
          </button>
          <button id="cancel-action" class="secondary" type="button">
            Cancel
          </button>
        </div>
      </section>

      <div id="status" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
